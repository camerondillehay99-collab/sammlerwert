# docker compose -f deploy/docker-compose.yml up -d
# Erst-Import danach: docker compose -f deploy/docker-compose.yml exec app bun run scripts/ingest.ts --fetch
services:
  app:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    volumes: [ "sammlerwert-data:/app/data" ]
    expose: [ "4180" ]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: [ "80:80", "443:443" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data", "caddy-config:/config" ]
    depends_on: [ app ]
volumes: { sammlerwert-data: {}, caddy-data: {}, caddy-config: {} }
