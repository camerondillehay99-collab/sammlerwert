name: Sync code from workspace
# The development workspace cannot push to GitHub directly. It queues file changes in the D1 table
# `deploy_patches`; this workflow turns them into a commit on main and triggers the deploy.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  contents: write
  actions: write
concurrency: sync-code
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - name: Apply queued changes
        id: apply
        run: bun run scripts/sync-from-d1.ts apply
      - name: Commit and push
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "Sammlerwert Sync"
          git config user.email "sync@users.noreply.github.com"
          git add -A -- ':!.sync-state.json'
          if git diff --cached --quiet; then echo "Keine Änderung gegenüber main – nichts zu committen."; else git commit -F "$RUNNER_TEMP/sync-message.txt" && git push; fi
      - name: Mark changes as applied
        if: steps.apply.outputs.changed == 'true'
        continue-on-error: true   # D1's daily write budget may be exhausted; rows are then re-applied (idempotent) on the next run
        run: bun run scripts/sync-from-d1.ts mark
      - name: Trigger deploy
        if: steps.apply.outputs.changed == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run deploy.yml --ref main
